[project]
name = "pipeline"
version = "0.1.0"
description = "Job runner for zbq BigQuery SQL pipelines"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["zbq"]

[project.scripts]
pipeline = "pipeline.cli:main"

[tool.uv.sources]
zbq = { path = "../zbq", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "sqlfluff>=3.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q", "--strict-markers"]

[tool.ruff]
line-length = 100
target-version = "py311"
